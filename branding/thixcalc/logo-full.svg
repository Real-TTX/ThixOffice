<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <!-- ThixCalc full logo: the app icon (logo-icon.svg) + word mark ("Thix" ink, "Calc" in the accent #107C41). For headers, README, about pages. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#34B26C"/>
      <stop offset="1" stop-color="#0C6B37"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F6EE"/>
    </linearGradient>
  </defs>
  <g transform="scale(0.78125)">
    <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
    <!-- the sheet with its dark header row -->
    <rect x="48" y="56" width="160" height="144" rx="18" fill="url(#sheet)"/>
    <path d="M66 56h124a18 18 0 0 1 18 18v14H48V74a18 18 0 0 1 18-18z" fill="#0A5A2E"/>
    <!-- the grid: a header column and the lines between the cells -->
    <path d="M48 88h34v112H66a18 18 0 0 1-18-18z" fill="#CFEBDB"/>
    <g stroke="#B5DEC6" stroke-width="3">
      <line x1="82" y1="116" x2="208" y2="116"/>
      <line x1="82" y1="144" x2="208" y2="144"/>
      <line x1="82" y1="172" x2="208" y2="172"/>
      <line x1="124" y1="88" x2="124" y2="200"/>
      <line x1="166" y1="88" x2="166" y2="200"/>
    </g>
    <!-- the chosen cell -->
    <rect x="124" y="116" width="42" height="28" fill="#107C41"/>
    <rect x="124" y="116" width="42" height="28" fill="none" stroke="#0A5A2E" stroke-width="4"/>
    <!-- the chart: three bars on a white disc that stands off the sheet -->
    <circle cx="186" cy="182" r="38" fill="#FFFFFF"/>
    <circle cx="186" cy="182" r="30" fill="#0A5A2E"/>
    <g fill="#FFFFFF">
      <rect x="168" y="185" width="10" height="14" rx="2"/>
      <rect x="181" y="175" width="10" height="24" rx="2"/>
      <rect x="194" y="164" width="10" height="35" rx="2"/>
    </g>
  </g>
  <text x="228" y="134" font-family="'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="650" letter-spacing="-2">
    <tspan fill="#111827">Thix</tspan><tspan fill="#107C41">Calc</tspan>
  </text>
</svg>
