<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    The file icon of ThixCalc's workbooks (Explorer, Finder): a white page with a folded corner and a grey grid of cells, and
    ThixCalc's tile as a badge at the bottom right (a two by two grid in white with the chosen cell), set off by a white ring.
  -->
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#34B26C"/>
      <stop offset="1" stop-color="#0C6B37"/>
    </linearGradient>
  </defs>
  <path d="M52 14h100l62 62v150a16 16 0 0 1-16 16H52a16 16 0 0 1-16-16V30a16 16 0 0 1 16-16z" fill="#FFFFFF" stroke="#CDD5E1" stroke-width="5"/>
  <path d="M152 14v46a16 16 0 0 0 16 16h46z" fill="#C7E8D4"/>
  <g stroke="#D3DCE8" stroke-width="6">
    <rect x="60" y="92" width="120" height="84" fill="none"/>
    <line x1="60" y1="120" x2="180" y2="120"/>
    <line x1="60" y1="148" x2="180" y2="148"/>
    <line x1="100" y1="92" x2="100" y2="176"/>
    <line x1="140" y1="92" x2="140" y2="176"/>
  </g>
  <rect x="118" y="130" width="122" height="122" rx="30" fill="url(#badge)" stroke="#FFFFFF" stroke-width="8"/>
  <g stroke="#FFFFFF" stroke-width="10">
    <rect x="146" y="158" width="66" height="66" rx="8" fill="none"/>
    <line x1="146" y1="191" x2="212" y2="191"/>
    <line x1="179" y1="158" x2="179" y2="224"/>
  </g>
  <rect x="179" y="191" width="33" height="33" fill="#FFFFFF"/>
</svg>
