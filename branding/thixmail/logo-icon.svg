<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    ThixMail app icon, full detail (48 px and larger): a white envelope with its flap and a letter peeking out, an @ badge –
    on a tile in ThixMail's blue (#0F6CBD). Geometry on a 256 grid; tools/render-icons.js renders PNG, ICO and ICNS.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4C9BE8"/>
      <stop offset="1" stop-color="#0A5AA3"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F0FA"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <!-- the letter that peeks out -->
  <rect x="66" y="52" width="124" height="96" rx="10" fill="#FFFFFF"/>
  <g fill="#BFD6EE">
    <rect x="82" y="70" width="70" height="9" rx="4.5"/>
    <rect x="82" y="88" width="92" height="9" rx="4.5"/>
  </g>
  <!-- the envelope: its back, the two sides and the flap -->
  <path d="M40 112l88 58 88-58v74a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16z" fill="url(#paper)"/>
  <path d="M40 186l70-50 18 12 18-12 70 50a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16z" fill="#D6E6F7"/>
  <path d="M40 112l88 58 88-58" fill="none" stroke="#0A5AA3" stroke-width="6" stroke-linejoin="round"/>
  <!-- the @ on a white disc that stands off the envelope -->
  <circle cx="192" cy="190" r="30" fill="#FFFFFF"/>
  <circle cx="192" cy="190" r="23" fill="#0A4F8F"/>
  <circle cx="192" cy="190" r="6.5" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M198.5 184v9a4.5 4.5 0 0 0 9 0v-3a15.5 15.5 0 1 0-6 12.2" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
</svg>
