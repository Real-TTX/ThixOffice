  <g stroke="#FFFFFF" stroke-width="22" stroke-linecap="round">
    <line x1="128" y1="180" x2="128" y2="220"/>
  </g>
  <rect x="26" y="40" width="204" height="148" rx="22" fill="#FFFFFF"/>
  <circle cx="128" cy="114" r="46" fill="#EE9475"/>
  <path d="M128 114V68a46 46 0 0 1 43.7 31.8z" fill="#A93216" transform="translate(6 -6)"/>
