<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    ThixShow app icon, full detail (48 px and larger): a slide on its stand – a title line, a pie chart with one slice
    taken out in the accent and two lines of text – on a tile in ThixShow's orange (#C43E1C).
    Geometry on a 256 grid; tools/render-icons.js renders PNG, ICO and ICNS.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F0784F"/>
      <stop offset="1" stop-color="#B0361A"/>
    </linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDEEE8"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <!-- the stand -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <line x1="128" y1="176" x2="128" y2="206"/>
    <path d="M98 214L128 190L158 214" fill="none"/>
  </g>
  <!-- the slide with its title line -->
  <rect x="40" y="52" width="176" height="128" rx="16" fill="url(#slide)"/>
  <rect x="58" y="70" width="84" height="12" rx="6" fill="#8E2A12"/>
  <!-- the pie chart: the slice in the accent stands out -->
  <circle cx="96" cy="132" r="28" fill="#F4B8A4"/>
  <path d="M96 132V104a28 28 0 0 1 26.6 19.3z" fill="#C43E1C" transform="translate(4 -4)"/>
  <!-- two lines of text -->
  <g stroke="#C43E1C" stroke-width="10" stroke-linecap="round">
    <line x1="142" y1="118" x2="194" y2="118"/>
    <line x1="142" y1="142" x2="178" y2="142"/>
  </g>
</svg>
