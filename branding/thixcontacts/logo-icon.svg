<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    ThixContacts app icon, full detail (48 px and larger): an address card with a person in a round frame and the lines of a
    name and an address, a star badge for the favourites – on a tile in ThixContacts' violet (#8764B8).
    Geometry on a 256 grid; tools/render-icons.js renders PNG, ICO and ICNS.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#A98AD6"/>
      <stop offset="1" stop-color="#6A4A9A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0EAF8"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <!-- the card with its band at the top -->
  <rect x="40" y="62" width="176" height="132" rx="18" fill="url(#card)"/>
  <path d="M58 62h140a18 18 0 0 1 18 18v6H40v-6a18 18 0 0 1 18-18z" fill="#4E3478"/>
  <!-- the person in a round frame -->
  <circle cx="92" cy="138" r="32" fill="#DCCFEE"/>
  <circle cx="92" cy="128" r="12" fill="#6A4A9A"/>
  <path d="M68 160a24 20 0 0 1 48 0z" fill="#6A4A9A"/>
  <!-- name and address -->
  <rect x="136" y="114" width="60" height="10" rx="5" fill="#6A4A9A"/>
  <rect x="136" y="134" width="48" height="8" rx="4" fill="#C3B2DE"/>
  <rect x="136" y="150" width="56" height="8" rx="4" fill="#C3B2DE"/>
  <!-- the favourite: a star on a white disc that stands off the card -->
  <circle cx="190" cy="186" r="30" fill="#FFFFFF"/>
  <circle cx="190" cy="186" r="23" fill="#4E3478"/>
  <path d="M190 172l4.4 8.9 9.8 1.4-7.1 6.9 1.7 9.8-8.8-4.6-8.8 4.6 1.7-9.8-7.1-6.9 9.8-1.4z" fill="#FFFFFF"/>
</svg>
