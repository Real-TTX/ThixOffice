<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <!-- ThixWrite full logo: the app icon (logo-icon.svg) + word mark ("Thix" ink, "Write" in the accent #185ABD). For headers, README, about pages. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4F8DEA"/>
      <stop offset="1" stop-color="#1450B0"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F0FC"/>
    </linearGradient>
  </defs>
  <g transform="scale(0.78125)">
    <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
    <!-- the page, its folded corner -->
    <path d="M74 50h76l42 42v104a14 14 0 0 1-14 14H74a14 14 0 0 1-14-14V64a14 14 0 0 1 14-14z" fill="url(#sheet)"/>
    <path d="M150 50v30a12 12 0 0 0 12 12h30z" fill="#B7CCF0"/>
    <!-- the text -->
    <g stroke="#185ABD" stroke-width="11" stroke-linecap="round">
      <line x1="84" y1="112" x2="166" y2="112"/>
      <line x1="84" y1="138" x2="166" y2="138"/>
      <line x1="84" y1="164" x2="124" y2="164"/>
    </g>
    <!-- the pen, writing on: a white outline sets it off the page -->
    <g transform="translate(181 202) rotate(-45)">
      <path d="M-12-30h24v48a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8z M-12-30L0-58L12-30z" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
      <path d="M-12-30h24v48a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8z" fill="#0F3E8C"/>
      <rect x="-12" y="4" width="24" height="7" fill="#5C93E6"/>
      <path d="M-12-30L0-58L12-30z" fill="#F3F6FC"/>
      <path d="M-4.3-48L0-58L4.3-48z" fill="#0F3E8C"/>
    </g>
  </g>
  <text x="228" y="134" font-family="'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="650" letter-spacing="-2">
    <tspan fill="#111827">Thix</tspan><tspan fill="#185ABD">Write</tspan>
  </text>
</svg>
