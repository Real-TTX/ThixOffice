<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    The file icon of ThixWrite's documents (Explorer, Finder): a white page with a folded corner and grey lines of text, and
    ThixWrite's tile as a badge at the bottom right (three lines of text in white), set off by a white ring.
  -->
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4F8DEA"/>
      <stop offset="1" stop-color="#1450B0"/>
    </linearGradient>
  </defs>
  <path d="M52 14h100l62 62v150a16 16 0 0 1-16 16H52a16 16 0 0 1-16-16V30a16 16 0 0 1 16-16z" fill="#FFFFFF" stroke="#CDD5E1" stroke-width="5"/>
  <path d="M152 14v46a16 16 0 0 0 16 16h46z" fill="#C9D8F2"/>
  <g stroke="#D3DCE8" stroke-width="12" stroke-linecap="round">
    <line x1="64" y1="104" x2="176" y2="104"/>
    <line x1="64" y1="132" x2="176" y2="132"/>
    <line x1="64" y1="160" x2="110" y2="160"/>
  </g>
  <rect x="118" y="130" width="122" height="122" rx="30" fill="url(#badge)" stroke="#FFFFFF" stroke-width="8"/>
  <g stroke="#FFFFFF" stroke-width="13" stroke-linecap="round">
    <line x1="148" y1="168" x2="210" y2="168"/>
    <line x1="148" y1="192" x2="210" y2="192"/>
    <line x1="148" y1="216" x2="182" y2="216"/>
  </g>
</svg>
